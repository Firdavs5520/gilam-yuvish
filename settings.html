<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <title>Sozlamalar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">Gilam yuvish</div>
        <div class="brand-subtitle">Sozlamalar</div>
      </div>
      <nav class="nav">
        <a href="index.html">Yangi buyurtma</a>
        <a href="cheklar.html">Cheklar</a>
        <a href="hisobot.html">Hisobot</a>
        <a class="active" href="settings.html">Sozlamalar</a>
        <button type="button" onclick="logout()">Chiqish</button>
      </nav>
    </aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1 class="page-title">Sozlamalar</h1>
          <div class="page-kicker">Chek, narx va firma ma’lumotlarini kodga tegmasdan boshqaring.</div>
        </div>
        <div class="toolbar">
          <button class="btn secondary" type="button" onclick="location.href='index.html'">Yangi buyurtma</button>
          <button class="btn secondary" type="button" onclick="location.href='cheklar.html'">Cheklar</button>
        </div>
      </header>

      <form class="panel pad" id="settingsForm">
        <section class="section">
          <h2 class="section-title">Firma ma’lumotlari</h2>
          <div class="grid two">
            <div class="field">
              <label for="businessName">Firma nomi</label>
              <input class="input" id="businessName" />
            </div>
            <div class="field">
              <label for="phone">Telefon</label>
              <input class="input" id="phone" />
            </div>
            <div class="field">
              <label for="addressLine1">Manzil 1</label>
              <input class="input" id="addressLine1" />
            </div>
            <div class="field">
              <label for="addressLine2">Manzil 2</label>
              <input class="input" id="addressLine2" />
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Chek ko‘rinishi</h2>
          <div class="grid two">
            <div class="field">
              <label for="logoUrl">Logo URL</label>
              <input class="input" id="logoUrl" />
            </div>
            <div class="field">
              <label for="defaultPricePerM2">1 m² narxi</label>
              <input class="input" id="defaultPricePerM2" type="number" min="1" />
            </div>
          </div>
          <div class="field" style="margin-top: 10px;">
            <label for="warningText">Chek ogohlantirish matni</label>
            <textarea class="textarea" id="warningText"></textarea>
          </div>
        </section>

        <div class="toolbar" style="margin-top: 12px;">
          <button class="btn" id="saveBtn" type="submit">Saqlash</button>
          <div id="message" class="message"></div>
        </div>
      </form>
    </main>
  </div>

  <script src="shared.js"></script>
  <script>
    const {
      apiFetch,
      loadMeta,
      logout,
      readJsonResponse,
    } = window.GilamApp;
    window.logout = logout;

    const fields = {
      businessName: document.getElementById("businessName"),
      addressLine1: document.getElementById("addressLine1"),
      addressLine2: document.getElementById("addressLine2"),
      phone: document.getElementById("phone"),
      logoUrl: document.getElementById("logoUrl"),
      defaultPricePerM2: document.getElementById("defaultPricePerM2"),
      warningText: document.getElementById("warningText"),
    };
    const form = document.getElementById("settingsForm");
    const saveBtn = document.getElementById("saveBtn");
    const message = document.getElementById("message");

    async function loadSettings() {
      try {
        const meta = await loadMeta(true);
        Object.entries(fields).forEach(([key, field]) => {
          field.value = meta.settings[key] || "";
        });
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message || "Sozlamalarni yuklashda xatolik";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "message";
      message.textContent = "";
      saveBtn.disabled = true;
      saveBtn.textContent = "Saqlanmoqda...";

      const payload = Object.fromEntries(
        Object.entries(fields).map(([key, field]) => [key, field.value])
      );

      try {
        const response = await apiFetch("/settings", {
          method: "PUT",
          body: JSON.stringify(payload),
        });
        await readJsonResponse(response);
        await loadMeta(true);
        message.textContent = "Sozlamalar saqlandi";
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message || "Saqlashda xatolik";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Saqlash";
      }
    });

    loadSettings();
  </script>
</body>

</html>
