<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <title>Чек</title>
  <style>
    @media print {
      @page {
        size: 58mm auto;
        margin: 0;
      }
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      width: 58mm;
      margin: 0;
      padding: 7px;
      font-size: 12px;
      color: #000;
    }

    .center {
      text-align: center;
    }

    .bold {
      font-weight: bold;
    }

    .right {
      text-align: right;
    }

    .line {
      border-top: 1px dashed #000;
      margin: 7px 0;
    }

    .small {
      font-size: 11px;
      line-height: 1.35;
    }

    .receipt-no {
      border: 1px solid #000;
      padding: 4px;
      margin: 6px 0;
      text-align: center;
      font-weight: bold;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 2px 0;
    }

    .label {
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    td {
      padding: 2px 0;
    }
  </style>
</head>

<body>
  <div id="out"></div>

  <script src="shared.js"></script>
  <script>
    const {
      apiFetch,
      fallbackSettings,
      formatMoney,
      loadMeta,
      readJsonResponse,
    } = window.GilamApp;

    const out = document.getElementById("out");

    function div(text = "", className = "") {
      const element = document.createElement("div");
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function line() {
      return div("", "line");
    }

    function addText(parent, text) {
      parent.appendChild(document.createTextNode(text));
    }

    function addBreak(parent) {
      parent.appendChild(document.createElement("br"));
    }

    function showMessage(message) {
      out.replaceChildren(div(message, "center"));
    }

    function addRow(table, cells) {
      const tr = document.createElement("tr");
      cells.forEach((cell) => {
        const td = document.createElement("td");
        if (cell.className) td.className = cell.className;
        td.textContent = cell.text;
        tr.appendChild(td);
      });
      table.appendChild(tr);
      return tr;
    }

    function addMultiline(parent, text) {
      String(text || "")
        .split("\n")
        .forEach((lineText, index) => {
          if (index) addBreak(parent);
          addText(parent, lineText);
        });
    }

    function buildReceipt(order, settings) {
      if (!order || !Array.isArray(order.items)) {
        showMessage("Нет данных");
        return;
      }

      const fragment = document.createDocumentFragment();
      const header = div("", "center");

      if (settings.logoUrl) {
        const logo = document.createElement("img");
        logo.src = settings.logoUrl;
        logo.width = 110;
        header.appendChild(logo);
        addBreak(header);
      }

      header.appendChild(div(settings.businessName || "", "bold"));
      const address = div("", "small");
      addText(address, settings.addressLine1 || "");
      addBreak(address);
      addText(address, settings.addressLine2 || "");
      addBreak(address);
      addText(address, `Тел: ${settings.phone || ""}`);
      header.appendChild(address);
      fragment.appendChild(header);
      fragment.appendChild(line());
      fragment.appendChild(div(order.orderNoLabel || "№------", "receipt-no"));

      const date = new Date(order.createdAt || Date.now()).toLocaleString("ru-RU", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });

      fragment.appendChild(div(date, "center bold"));
      fragment.appendChild(line());
      fragment.appendChild(div(order.name || "", "bold"));
      fragment.appendChild(div(order.address || "", "small"));
      fragment.appendChild(div(order.phone || "", "small"));
      fragment.appendChild(line());

      const table = document.createElement("table");
      addRow(table, [
        { text: "Наим." },
        { text: "Размер" },
        { text: "Цена", className: "right" },
        { text: "Сумма", className: "right" },
      ]).className = "bold";

      let total = 0;
      order.items.forEach((item) => {
        const l = Number(item.l) || 0;
        const w = Number(item.w) || 0;
        const price = Number(item.price) || Number(settings.defaultPricePerM2) || 15000;
        const sum = Number(item.sum) || Math.round(l * w * price);
        total += sum;

        addRow(table, [
          { text: "КОВЕР" },
          { text: `${l}x${w} м²` },
          { text: formatMoney(price), className: "right" },
          { text: formatMoney(sum), className: "right" },
        ]);
      });

      fragment.appendChild(table);
      fragment.appendChild(line());
      [
        ["ИТОГО", `${formatMoney(total)} сум`],
        ["Оплачено", `${formatMoney(order.paid)} сум`],
        ["Остаток", `${formatMoney(order.balance)} сум`],
        ["Оплата", order.paymentType || "-"],
        ["Статус", order.statusLabel || "-"],
      ].forEach(([label, value]) => {
        const row = div("", "info-row");
        row.appendChild(div(label, "label"));
        row.appendChild(div(value, "bold"));
        fragment.appendChild(row);
      });
      fragment.appendChild(line());

      const warning = div("", "small");
      const warningTitle = document.createElement("b");
      warningTitle.textContent = "ВНИМАНИЕ ЗАКАЗЧИКА!";
      warning.appendChild(warningTitle);
      addBreak(warning);
      addMultiline(warning, settings.warningText);
      fragment.appendChild(warning);
      fragment.appendChild(line());
      fragment.appendChild(div("Подпись клиента: ______________________", "small"));

      out.replaceChildren(fragment);

      setTimeout(() => {
        window.print();
      }, 300);

      window.onafterprint = () => {
        if (!new URLSearchParams(location.search).get("id")) {
          localStorage.removeItem("printOrder");
        }

        if (window.opener) {
          window.close();
        } else {
          location.href = "index.html";
        }
      };
    }

    async function loadOrder() {
      try {
        const id = new URLSearchParams(location.search).get("id");
        let order = null;
        let settings = fallbackSettings;

        try {
          const meta = await loadMeta();
          settings = meta.settings;
        } catch {
          settings = fallbackSettings;
        }

        if (id) {
          const response = await apiFetch(`/orders/${encodeURIComponent(id)}`);
          order = await readJsonResponse(response);
        } else {
          order = JSON.parse(localStorage.getItem("printOrder") || "null");
        }

        buildReceipt(order, settings);
      } catch (error) {
        showMessage(error.message || "Chekni yuklashda xatolik");
      }
    }

    loadOrder();
  </script>
</body>

</html>
