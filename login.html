<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <title>Admin kirish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="login-page">
  <form class="login-card" id="loginForm">
    <div class="brand" style="padding: 0; color: var(--text);">
      <div class="brand-title">Gilam yuvish</div>
      <div class="brand-subtitle" style="color: var(--muted);">Admin panelga kirish</div>
    </div>

    <div class="field" style="margin-top: 18px;">
      <label for="password">Admin parol</label>
      <input class="input" id="password" type="password" autocomplete="current-password" autofocus />
    </div>

    <button class="btn full" id="submitBtn" type="submit">Kirish</button>
    <div id="error" class="message error"></div>
  </form>

  <script src="shared.js"></script>
  <script>
    const { loginWithPassword, redirectAfterLogin } = window.GilamApp;
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const error = document.getElementById("error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Tekshirilmoqda...";

      try {
        await loginWithPassword(password.value);
        redirectAfterLogin();
      } catch (err) {
        error.textContent = err.message || "Kirishda xatolik";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Kirish";
      }
    });
  </script>
</body>

</html>
