<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <title>Admin kirish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #020617;
      --card: rgba(2, 6, 23, 0.88);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #1e293b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #0f172a, #020617 52%, #000);
      color: var(--text);
      font-family: system-ui, sans-serif;
      padding: 16px;
    }

    form {
      width: min(100%, 380px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 18px 80px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      text-align: center;
    }

    .subtitle {
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      margin-top: 10px;
    }

    input {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button {
      border: none;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: #000;
      font-weight: 800;
      cursor: pointer;
    }

    .error {
      color: var(--danger);
      min-height: 20px;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <form id="loginForm">
    <h1>Admin kirish</h1>
    <div class="subtitle">Gilam buyurtmalari paneli</div>
    <input id="password" type="password" autocomplete="current-password" placeholder="Admin parol" autofocus />
    <button id="submitBtn" type="submit">Kirish</button>
    <div id="error" class="error"></div>
  </form>

  <script src="shared.js"></script>
  <script>
    const { loginWithPassword, redirectAfterLogin } = window.GilamApp;
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const error = document.getElementById("error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Tekshirilmoqda...";

      try {
        await loginWithPassword(password.value);
        redirectAfterLogin();
      } catch (err) {
        error.textContent = err.message || "Kirishda xatolik";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Kirish";
      }
    });
  </script>
</body>

</html>
