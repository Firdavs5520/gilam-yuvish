<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <title>Brand — Yangi chek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #020617;
      --card: rgba(2, 6, 23, 0.86);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #1e293b;
      --danger: #ef4444;
      --success: #22c55e;
      --warn: #facc15;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #020617, #000);
      color: var(--text);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: rgba(2, 6, 23, 0.92);
      border-right: 1px solid var(--border);
      padding: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .menu button,
    .ghost {
      width: 100%;
      background: none;
      border: 1px solid transparent;
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .menu button:hover,
    .ghost:hover {
      background: rgba(56, 189, 248, 0.15);
    }

    .main {
      flex: 1;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      margin-top: 10px;
    }

    input {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button {
      border: none;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: #000;
      font-weight: 800;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 12px 0;
    }

    li {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      border-bottom: 1px dashed var(--border);
      padding: 8px 0;
      gap: 8px;
    }

    .item-actions {
      display: flex;
      gap: 6px;
    }

    .item-actions button {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 8px;
      margin-top: 0;
    }

    .edit {
      background: var(--warn);
      color: #000;
    }

    .delete {
      background: var(--danger);
      color: #fff;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .summary div {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      color: var(--muted);
    }

    .summary b {
      display: block;
      color: var(--text);
      margin-top: 4px;
      font-size: 18px;
    }

    .pay-buttons {
      display: flex;
      gap: 8px;
    }

    .pay-buttons button.active {
      background: var(--success);
      color: #000;
    }

    .loading {
      display: none;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .app {
        display: block;
      }

      .sidebar {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .menu {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .menu button {
        margin-bottom: 0;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo" id="brandName">Brand</div>
      <div class="menu">
        <button onclick="location.href='cheklar.html'">Cheklar</button>
        <button onclick="location.href='hisobot.html'">Hisobotlar</button>
        <button onclick="location.href='settings.html'">Sozlamalar</button>
        <button onclick="logout()">Chiqish</button>
      </div>
    </aside>

    <main class="main">
      <div class="card">
        <h1>Yangi buyurtma</h1>

        <input id="customerName" placeholder="Familiya, Ism" />
        <input id="phone" type="text" placeholder="+998 (__) ___-__-__" />
        <input id="address" placeholder="Manzil" />
        <input id="price" type="number" value="15000" min="1" />
        <input id="l" type="number" placeholder="Uzunlik (m)" min="0.01" step="0.01" />
        <input id="w" type="number" placeholder="Eni (m)" min="0.01" step="0.01" />

        <button onclick="addItem()">Gilam qo‘shish</button>
        <ul id="list"></ul>

        <div class="summary">
          <div>Jami<b id="total">0</b></div>
          <div>To‘langan<b id="paidView">0</b></div>
          <div>Qoldiq<b id="balance">0</b></div>
        </div>

        <input id="paid" type="number" placeholder="To‘langan summa" min="0" />

        <div class="pay-buttons">
          <button id="payNaqd" class="active" onclick="setPay('Naqd')">Naqd</button>
          <button id="payKarta" onclick="setPay('Karta')">Karta</button>
        </div>

        <button onclick="saveOrder()">Chek chiqarish</button>
        <div class="loading" id="loading">Saqlanmoqda...</div>
      </div>
    </main>
  </div>

  <script src="shared.js"></script>
  <script>
    const {
      apiFetch,
      formatMoney,
      loadMeta,
      logout,
      readJsonResponse,
    } = window.GilamApp;
    window.logout = logout;

    const nameInput = document.getElementById("customerName");
    const phoneInput = document.getElementById("phone");
    const addressInput = document.getElementById("address");
    const priceInput = document.getElementById("price");
    const lInput = document.getElementById("l");
    const wInput = document.getElementById("w");
    const paidInput = document.getElementById("paid");
    const list = document.getElementById("list");
    const totalEl = document.getElementById("total");
    const paidView = document.getElementById("paidView");
    const balanceEl = document.getElementById("balance");
    const loading = document.getElementById("loading");
    const payNaqdBtn = document.getElementById("payNaqd");
    const payKartaBtn = document.getElementById("payKarta");
    const brandName = document.getElementById("brandName");

    let items = [];
    let editIndex = null;
    let paymentType = "Naqd";

    nameInput.addEventListener("input", () => {
      nameInput.value = nameInput.value
        .toLowerCase()
        .replace(/\b\w/g, (letter) => letter.toUpperCase());
    });

    phoneInput.addEventListener("input", () => {
      let value = phoneInput.value.replace(/\D/g, "");
      if (value.startsWith("998")) value = value.slice(3);
      if (value.length > 9) value = value.slice(0, 9);

      let formatted = "+998";
      if (value.length > 0) formatted += " (" + value.slice(0, 2);
      if (value.length >= 2) formatted += ")";
      if (value.length > 2) formatted += " " + value.slice(2, 5);
      if (value.length > 5) formatted += "-" + value.slice(5, 7);
      if (value.length > 7) formatted += "-" + value.slice(7, 9);

      phoneInput.value = formatted;
    });

    paidInput.addEventListener("input", render);

    function setPay(type) {
      paymentType = type;
      payNaqdBtn.classList.toggle("active", type === "Naqd");
      payKartaBtn.classList.toggle("active", type === "Karta");
    }

    function currentTotal() {
      return items.reduce((sum, item) => sum + item.sum, 0);
    }

    function addItem() {
      const l = Number(lInput.value);
      const w = Number(wInput.value);
      const price = Number(priceInput.value);

      if (!Number.isFinite(l) || l <= 0) return alert("Uzunlikni to'g'ri kiriting");
      if (!Number.isFinite(w) || w <= 0) return alert("Enini to'g'ri kiriting");
      if (!Number.isFinite(price) || price <= 0) return alert("Narxni to'g'ri kiriting");

      const item = { l, w, price, sum: Math.round(l * w * price) };

      if (editIndex !== null) {
        items[editIndex] = item;
        editIndex = null;
      } else {
        items.push(item);
      }

      lInput.value = "";
      wInput.value = "";
      render();
    }

    function render() {
      list.replaceChildren();

      items.forEach((item, index) => {
        const li = document.createElement("li");
        const size = document.createElement("span");
        const price = document.createElement("span");
        const actions = document.createElement("div");
        const editButton = document.createElement("button");
        const deleteButton = document.createElement("button");

        size.textContent = `${item.l} x ${item.w} m²`;
        price.textContent = formatMoney(item.sum);
        actions.className = "item-actions";
        editButton.className = "edit";
        editButton.type = "button";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => editItem(index));
        deleteButton.className = "delete";
        deleteButton.type = "button";
        deleteButton.textContent = "Del";
        deleteButton.addEventListener("click", () => removeItem(index));

        actions.append(editButton, deleteButton);
        li.append(size, price, actions);
        list.appendChild(li);
      });

      const total = currentTotal();
      const paid = Number(paidInput.value || 0);
      totalEl.textContent = formatMoney(total);
      paidView.textContent = formatMoney(paid);
      balanceEl.textContent = formatMoney(Math.max(total - paid, 0));
    }

    function editItem(index) {
      lInput.value = items[index].l;
      wInput.value = items[index].w;
      priceInput.value = items[index].price;
      editIndex = index;
    }

    function removeItem(index) {
      if (!confirm("Gilam o‘chirilsinmi?")) return;
      items.splice(index, 1);
      render();
    }

    async function saveOrder() {
      if (!nameInput.value.trim()) return alert("Ism kiriting");
      if (!/^998\d{9}$/.test(phoneInput.value.replace(/\D/g, ""))) {
        return alert("Telefonni to'g'ri kiriting");
      }
      if (!addressInput.value.trim()) return alert("Manzil kiriting");
      if (!items.length) return alert("Kamida 1 ta gilam qo‘shing");

      const total = currentTotal();
      const paid = Number(paidInput.value || 0);
      if (!Number.isFinite(paid) || paid < 0) return alert("To'langan summani to'g'ri kiriting");
      if (paid > total) return alert("To'langan summa jami summadan katta bo'lmasin");

      loading.style.display = "flex";

      try {
        const response = await apiFetch("/orders", {
          method: "POST",
          body: JSON.stringify({
            name: nameInput.value,
            phone: phoneInput.value,
            address: addressInput.value,
            items: items.map((item) => ({
              l: item.l,
              w: item.w,
              price: item.price,
            })),
            paid,
            paymentType,
          }),
        });
        const data = await readJsonResponse(response);

        localStorage.setItem("printOrder", JSON.stringify(data.order));
        location.href = "print.html";
      } catch (error) {
        alert(error.message || "Buyurtmani saqlashda xatolik");
      } finally {
        loading.style.display = "none";
      }
    }

    async function init() {
      try {
        const meta = await loadMeta();
        brandName.textContent = meta.settings.businessName || "Brand";
        priceInput.value = meta.settings.defaultPricePerM2 || 15000;
      } catch {
        // loadMeta redirects to login when needed.
      }
    }

    init();
    render();
  </script>
</body>

</html>
