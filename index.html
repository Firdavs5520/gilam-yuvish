<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <title>Yangi buyurtma</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title" id="brandName">Gilam yuvish</div>
        <div class="brand-subtitle">Admin panel</div>
      </div>
      <nav class="nav">
        <a class="active" href="index.html">Yangi buyurtma</a>
        <a href="cheklar.html">Cheklar</a>
        <a href="hisobot.html">Hisobot</a>
        <a href="settings.html">Sozlamalar</a>
        <button type="button" onclick="logout()">Chiqish</button>
      </nav>
    </aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1 class="page-title">Yangi buyurtma</h1>
          <div class="page-kicker">Mijoz, gilam o‘lchamlari va to‘lovni bitta joyda kiriting.</div>
        </div>
        <div class="toolbar">
          <button class="btn secondary" type="button" onclick="location.href='cheklar.html'">Cheklar ro‘yxati</button>
          <button class="btn secondary" type="button" onclick="location.href='hisobot.html'">Hisobot</button>
        </div>
      </header>

      <div class="panel pad">
        <section class="section">
          <h2 class="section-title">Mijoz ma’lumotlari</h2>
          <div class="grid three">
            <div class="field">
              <label for="customerName">Familiya, ism</label>
              <input class="input" id="customerName" placeholder="Ali Valiyev" />
            </div>
            <div class="field">
              <label for="phone">Telefon</label>
              <input class="input" id="phone" type="text" placeholder="+998 (__) ___-__-__" />
            </div>
            <div class="field">
              <label for="address">Manzil</label>
              <input class="input" id="address" placeholder="Manzil" />
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Gilam o‘lchami</h2>
          <div class="grid three">
            <div class="field">
              <label for="price">1 m² narxi</label>
              <input class="input" id="price" type="number" value="15000" min="1" />
            </div>
            <div class="field">
              <label for="l">Uzunlik (m)</label>
              <input class="input" id="l" type="number" min="0.01" step="0.01" />
            </div>
            <div class="field">
              <label for="w">Eni (m)</label>
              <input class="input" id="w" type="number" min="0.01" step="0.01" />
            </div>
          </div>
          <button class="btn" type="button" onclick="addItem()">Gilam qo‘shish</button>
          <ul class="item-list" id="list"></ul>
        </section>

        <section class="section">
          <h2 class="section-title">To‘lov va yakun</h2>
          <div class="summary-grid">
            <div class="metric">Jami<b id="total">0</b></div>
            <div class="metric">To‘langan<b id="paidView">0</b></div>
            <div class="metric warning">Qoldiq<b id="balance">0</b></div>
          </div>

          <div class="grid two" style="margin-top: 12px;">
            <div class="field">
              <label for="paid">To‘langan summa</label>
              <input class="input" id="paid" type="number" min="0" />
            </div>
            <div class="field">
              <label>To‘lov turi</label>
              <div class="toolbar">
                <button id="payNaqd" class="btn success" type="button" onclick="setPay('Naqd')">Naqd</button>
                <button id="payKarta" class="btn secondary" type="button" onclick="setPay('Karta')">Karta</button>
              </div>
            </div>
          </div>

          <button class="btn full" type="button" onclick="saveOrder()">Saqlash va chek chiqarish</button>
          <div class="message" id="loading"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="shared.js"></script>
  <script>
    const {
      apiFetch,
      formatMoney,
      loadMeta,
      logout,
      readJsonResponse,
    } = window.GilamApp;
    window.logout = logout;

    const nameInput = document.getElementById("customerName");
    const phoneInput = document.getElementById("phone");
    const addressInput = document.getElementById("address");
    const priceInput = document.getElementById("price");
    const lInput = document.getElementById("l");
    const wInput = document.getElementById("w");
    const paidInput = document.getElementById("paid");
    const list = document.getElementById("list");
    const totalEl = document.getElementById("total");
    const paidView = document.getElementById("paidView");
    const balanceEl = document.getElementById("balance");
    const loading = document.getElementById("loading");
    const payNaqdBtn = document.getElementById("payNaqd");
    const payKartaBtn = document.getElementById("payKarta");
    const brandName = document.getElementById("brandName");

    let items = [];
    let editIndex = null;
    let paymentType = "Naqd";

    nameInput.addEventListener("input", () => {
      nameInput.value = nameInput.value
        .toLowerCase()
        .replace(/\b\w/g, (letter) => letter.toUpperCase());
    });

    phoneInput.addEventListener("input", () => {
      let value = phoneInput.value.replace(/\D/g, "");
      if (value.startsWith("998")) value = value.slice(3);
      if (value.length > 9) value = value.slice(0, 9);

      let formatted = "+998";
      if (value.length > 0) formatted += " (" + value.slice(0, 2);
      if (value.length >= 2) formatted += ")";
      if (value.length > 2) formatted += " " + value.slice(2, 5);
      if (value.length > 5) formatted += "-" + value.slice(5, 7);
      if (value.length > 7) formatted += "-" + value.slice(7, 9);
      phoneInput.value = formatted;
    });

    paidInput.addEventListener("input", render);

    function setPay(type) {
      paymentType = type;
      payNaqdBtn.className = type === "Naqd" ? "btn success" : "btn secondary";
      payKartaBtn.className = type === "Karta" ? "btn success" : "btn secondary";
    }

    function currentTotal() {
      return items.reduce((sum, item) => sum + item.sum, 0);
    }

    function addItem() {
      const l = Number(lInput.value);
      const w = Number(wInput.value);
      const price = Number(priceInput.value);

      if (!Number.isFinite(l) || l <= 0) return alert("Uzunlikni to‘g‘ri kiriting");
      if (!Number.isFinite(w) || w <= 0) return alert("Enini to‘g‘ri kiriting");
      if (!Number.isFinite(price) || price <= 0) return alert("Narxni to‘g‘ri kiriting");

      const item = { l, w, price, sum: Math.round(l * w * price) };
      if (editIndex !== null) {
        items[editIndex] = item;
        editIndex = null;
      } else {
        items.push(item);
      }

      lInput.value = "";
      wInput.value = "";
      render();
    }

    function render() {
      list.replaceChildren();

      items.forEach((item, index) => {
        const li = document.createElement("li");
        const size = document.createElement("span");
        const price = document.createElement("span");
        const actions = document.createElement("div");
        const editButton = document.createElement("button");
        const deleteButton = document.createElement("button");

        li.className = "item-row";
        size.textContent = `${item.l} x ${item.w} m²`;
        price.textContent = `${formatMoney(item.sum)} so‘m`;
        actions.className = "actions";

        editButton.className = "btn secondary small";
        editButton.type = "button";
        editButton.textContent = "Tahrirlash";
        editButton.addEventListener("click", () => editItem(index));

        deleteButton.className = "btn danger small";
        deleteButton.type = "button";
        deleteButton.textContent = "O‘chirish";
        deleteButton.addEventListener("click", () => removeItem(index));

        actions.append(editButton, deleteButton);
        li.append(size, price, actions);
        list.appendChild(li);
      });

      const total = currentTotal();
      const paid = Number(paidInput.value || 0);
      totalEl.textContent = `${formatMoney(total)} so‘m`;
      paidView.textContent = `${formatMoney(paid)} so‘m`;
      balanceEl.textContent = `${formatMoney(Math.max(total - paid, 0))} so‘m`;
    }

    function editItem(index) {
      lInput.value = items[index].l;
      wInput.value = items[index].w;
      priceInput.value = items[index].price;
      editIndex = index;
    }

    function removeItem(index) {
      if (!confirm("Gilam o‘chirilsinmi?")) return;
      items.splice(index, 1);
      render();
    }

    async function saveOrder() {
      if (!nameInput.value.trim()) return alert("Ism kiriting");
      if (!/^998\d{9}$/.test(phoneInput.value.replace(/\D/g, ""))) {
        return alert("Telefonni to‘g‘ri kiriting");
      }
      if (!addressInput.value.trim()) return alert("Manzil kiriting");
      if (!items.length) return alert("Kamida 1 ta gilam qo‘shing");

      const total = currentTotal();
      const paid = Number(paidInput.value || 0);
      if (!Number.isFinite(paid) || paid < 0) return alert("To‘langan summani to‘g‘ri kiriting");
      if (paid > total) return alert("To‘langan summa jami summadan katta bo‘lmasin");

      loading.textContent = "Saqlanmoqda...";

      try {
        const response = await apiFetch("/orders", {
          method: "POST",
          body: JSON.stringify({
            name: nameInput.value,
            phone: phoneInput.value,
            address: addressInput.value,
            items: items.map((item) => ({
              l: item.l,
              w: item.w,
              price: item.price,
            })),
            paid,
            paymentType,
          }),
        });
        const data = await readJsonResponse(response);

        localStorage.setItem("printOrder", JSON.stringify(data.order));
        location.href = "print.html";
      } catch (error) {
        alert(error.message || "Buyurtmani saqlashda xatolik");
      } finally {
        loading.textContent = "";
      }
    }

    async function init() {
      try {
        const meta = await loadMeta();
        brandName.textContent = meta.settings.businessName || "Gilam yuvish";
        priceInput.value = meta.settings.defaultPricePerM2 || 15000;
      } catch {
        // loadMeta redirects to login when needed.
      }
    }

    init();
    render();
  </script>
</body>

</html>
