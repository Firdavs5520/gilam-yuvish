<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <title>Cheklar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">Gilam yuvish</div>
        <div class="brand-subtitle">Buyurtmalar</div>
      </div>
      <nav class="nav">
        <a href="index.html">Yangi buyurtma</a>
        <a class="active" href="cheklar.html">Cheklar</a>
        <a href="hisobot.html">Hisobot</a>
        <a href="settings.html">Sozlamalar</a>
        <button type="button" id="logoutBtn">Chiqish</button>
      </nav>
    </aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1 class="page-title">Cheklar</h1>
          <div class="page-kicker">Buyurtmalarni qidirish, status va to‘lovni boshqarish.</div>
        </div>
        <div class="toolbar">
          <button class="btn secondary" type="button" onclick="location.href='index.html'">Yangi buyurtma</button>
          <button class="btn secondary" type="button" id="backupBtn">Backup</button>
          <button class="btn" type="button" id="exportBtn">CSV export</button>
        </div>
      </header>

      <section class="panel pad">
        <div class="filters">
          <input class="input" id="search" placeholder="Ism, telefon yoki chek raqami" />
          <select class="select" id="statusFilter"></select>
          <label class="toolbar">
            <input id="debtOnly" type="checkbox" />
            <span>Faqat qarzdorlar</span>
          </label>
          <button class="btn secondary" type="button" id="refreshBtn">Yangilash</button>
        </div>
      </section>

      <section class="panel" style="margin-top: 14px;">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Chek</th>
                <th>Mijoz</th>
                <th>Telefon</th>
                <th>Sana</th>
                <th>Jami</th>
                <th>Qoldiq</th>
                <th>Holat</th>
                <th>Amal</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <ul class="mobile-list" id="mobileList"></ul>
      </section>
    </main>
  </div>

  <script src="shared.js"></script>
  <script>
    const {
      apiFetch,
      createStatusBadge,
      downloadBackup,
      exportCsv,
      formatDate,
      formatMoney,
      loadMeta,
      logout,
      readJsonResponse,
      statusLabel,
    } = window.GilamApp;

    const tbody = document.getElementById("tbody");
    const mobileList = document.getElementById("mobileList");
    const searchInput = document.getElementById("search");
    const statusFilter = document.getElementById("statusFilter");
    const debtOnly = document.getElementById("debtOnly");
    const refreshBtn = document.getElementById("refreshBtn");
    const exportBtn = document.getElementById("exportBtn");
    const backupBtn = document.getElementById("backupBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    let orders = [];
    let statuses = [];

    function filteredOrders() {
      const search = searchInput.value.trim().toLowerCase();
      const status = statusFilter.value;

      return orders.filter((order) => {
        const searchable = [
          order.orderNoLabel,
          order.name,
          order.phone,
          order.address,
        ].join(" ").toLowerCase();

        return (
          (!search || searchable.includes(search)) &&
          (!status || order.status === status) &&
          (!debtOnly.checked || Number(order.balance || 0) > 0)
        );
      });
    }

    function showMessage(message) {
      tbody.replaceChildren();
      mobileList.replaceChildren();
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      const item = document.createElement("li");

      cell.colSpan = 8;
      cell.textContent = message;
      row.appendChild(cell);
      tbody.appendChild(row);
      item.className = "mobile-card";
      item.textContent = message;
      mobileList.appendChild(item);
    }

    function addCell(row, text, className = "") {
      const td = document.createElement("td");
      td.textContent = text;
      if (className) td.className = className;
      row.appendChild(td);
      return td;
    }

    function createStatusSelect(order) {
      const select = document.createElement("select");
      select.className = "select";
      statuses.forEach((status) => {
        const option = document.createElement("option");
        option.value = status.value;
        option.textContent = status.label;
        select.appendChild(option);
      });
      select.value = order.status || "received";
      select.addEventListener("change", () => updateStatus(order._id, select.value));
      return select;
    }

    function createActionButtons(order) {
      const wrap = document.createElement("div");
      const openButton = document.createElement("button");
      const paymentButton = document.createElement("button");
      const deleteButton = document.createElement("button");

      wrap.className = "actions";
      openButton.className = "btn success small";
      openButton.type = "button";
      openButton.textContent = "Chop etish";
      openButton.addEventListener("click", () => openCheck(order._id));

      paymentButton.className = "btn secondary small";
      paymentButton.type = "button";
      paymentButton.textContent = "To‘lov";
      paymentButton.addEventListener("click", () => updatePayment(order));

      deleteButton.className = "btn danger small";
      deleteButton.type = "button";
      deleteButton.textContent = "O‘chirish";
      deleteButton.addEventListener("click", () => deleteCheck(order._id));

      wrap.append(openButton, paymentButton, deleteButton);
      return wrap;
    }

    function addMobileMeta(card, label, value, isDebt = false) {
      const metric = document.createElement("div");
      metric.className = isDebt ? "metric warning" : "metric";
      const text = document.createElement("span");
      const bold = document.createElement("b");
      text.textContent = label;
      bold.textContent = value;
      metric.append(text, bold);
      card.appendChild(metric);
    }

    function render() {
      const visible = filteredOrders();
      tbody.replaceChildren();
      mobileList.replaceChildren();

      if (!visible.length) {
        showMessage("Ma’lumot topilmadi");
        return;
      }

      visible.forEach((order) => {
        const row = document.createElement("tr");
        addCell(row, order.orderNoLabel || "№----");
        addCell(row, order.name || "Nomsiz mijoz");
        addCell(row, order.phone || "");
        addCell(row, formatDate(order.createdAt));
        addCell(row, `${formatMoney(order.total)} so‘m`);
        addCell(row, `${formatMoney(order.balance)} so‘m`, Number(order.balance || 0) > 0 ? "debt" : "");

        const statusCell = document.createElement("td");
        statusCell.appendChild(createStatusBadge(order.status, statuses));
        statusCell.appendChild(document.createTextNode(" "));
        statusCell.appendChild(createStatusSelect(order));
        row.appendChild(statusCell);

        const actionCell = document.createElement("td");
        actionCell.appendChild(createActionButtons(order));
        row.appendChild(actionCell);
        tbody.appendChild(row);

        const card = document.createElement("li");
        const title = document.createElement("div");
        const meta = document.createElement("div");
        const money = document.createElement("div");
        const statusLine = document.createElement("div");

        card.className = "mobile-card";
        title.className = "card-title";
        title.textContent = `${order.orderNoLabel || "№----"} · ${order.name || "Nomsiz mijoz"}`;
        meta.className = "meta";
        meta.textContent = `${order.phone || ""} · ${formatDate(order.createdAt)}`;
        money.className = "summary-grid";
        statusLine.className = "toolbar";
        addMobileMeta(money, "Jami", `${formatMoney(order.total)} so‘m`);
        addMobileMeta(money, "To‘langan", `${formatMoney(order.paid)} so‘m`);
        addMobileMeta(money, "Qoldiq", `${formatMoney(order.balance)} so‘m`, Number(order.balance || 0) > 0);
        statusLine.append(createStatusBadge(order.status, statuses), createStatusSelect(order));

        card.append(title, meta, money, statusLine, createActionButtons(order));
        mobileList.appendChild(card);
      });
    }

    function fillStatuses() {
      statusFilter.replaceChildren();
      const all = document.createElement("option");
      all.value = "";
      all.textContent = "Barcha holatlar";
      statusFilter.appendChild(all);

      statuses.forEach((status) => {
        const option = document.createElement("option");
        option.value = status.value;
        option.textContent = status.label;
        statusFilter.appendChild(option);
      });
    }

    async function loadChecks() {
      showMessage("Yuklanmoqda...");
      try {
        const response = await apiFetch("/orders?limit=1000");
        orders = await readJsonResponse(response);
        render();
      } catch (error) {
        showMessage(error.message || "Cheklarni yuklashda xatolik");
      }
    }

    function openCheck(id) {
      window.open(`print.html?id=${encodeURIComponent(id)}`, "_blank");
    }

    async function updateStatus(id, status) {
      try {
        const response = await apiFetch(`/orders/${encodeURIComponent(id)}/status`, {
          method: "PUT",
          body: JSON.stringify({ status }),
        });
        await readJsonResponse(response);
        await loadChecks();
      } catch (error) {
        alert(error.message || "Holatni yangilashda xatolik");
      }
    }

    async function updatePayment(order) {
      const value = prompt("To‘langan summa", order.paid || 0);
      if (value === null) return;

      try {
        const response = await apiFetch(`/orders/${encodeURIComponent(order._id)}/payment`, {
          method: "PATCH",
          body: JSON.stringify({
            paid: Number(value),
            paymentType: order.paymentType || "Naqd",
          }),
        });
        await readJsonResponse(response);
        await loadChecks();
      } catch (error) {
        alert(error.message || "To‘lovni yangilashda xatolik");
      }
    }

    async function deleteCheck(id) {
      if (!confirm("Chek o‘chirilsinmi?")) return;
      try {
        const response = await apiFetch(`/orders/${encodeURIComponent(id)}`, {
          method: "DELETE",
        });
        await readJsonResponse(response);
        await loadChecks();
      } catch (error) {
        alert(error.message || "O‘chirishda xatolik");
      }
    }

    function exportVisible() {
      exportCsv(
        "cheklar.csv",
        ["Chek", "Ism", "Telefon", "Sana", "Holat", "Jami", "To'langan", "Qoldiq"],
        filteredOrders().map((order) => [
          order.orderNoLabel,
          order.name,
          order.phone,
          formatDate(order.createdAt),
          statusLabel(order.status, statuses),
          order.total,
          order.paid,
          order.balance,
        ])
      );
    }

    async function init() {
      try {
        const meta = await loadMeta();
        statuses = meta.statuses;
        fillStatuses();
        await loadChecks();
      } catch {
        // loadMeta redirects to login when needed.
      }
    }

    searchInput.addEventListener("input", render);
    statusFilter.addEventListener("change", render);
    debtOnly.addEventListener("change", render);
    refreshBtn.addEventListener("click", loadChecks);
    exportBtn.addEventListener("click", exportVisible);
    backupBtn.addEventListener("click", () => downloadBackup().catch((error) => alert(error.message)));
    logoutBtn.addEventListener("click", logout);

    init();
  </script>
</body>

</html>
