<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <title>Hisobot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">Gilam yuvish</div>
        <div class="brand-subtitle">Hisobotlar</div>
      </div>
      <nav class="nav">
        <a href="index.html">Yangi buyurtma</a>
        <a href="cheklar.html">Cheklar</a>
        <a class="active" href="hisobot.html">Hisobot</a>
        <a href="settings.html">Sozlamalar</a>
        <button type="button" id="logoutBtn">Chiqish</button>
      </nav>
    </aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1 class="page-title">Hisobot</h1>
          <div class="page-kicker">Kunlik tushum, qoldiq va statuslarni tez ko‘ring.</div>
        </div>
        <div class="toolbar">
          <button class="btn secondary" type="button" onclick="location.href='index.html'">Yangi buyurtma</button>
          <button class="btn secondary" type="button" id="backupBtn">Backup</button>
          <button class="btn" type="button" id="exportBtn">CSV export</button>
        </div>
      </header>

      <section class="panel pad">
        <div class="filters">
          <div class="toolbar">
            <button class="btn" type="button" id="btnToday">Bugun</button>
            <button class="btn secondary" type="button" id="btnAll">Barchasi</button>
            <button class="btn secondary" type="button" id="btnDebt">Qarzdorlar</button>
          </div>
          <input class="input" id="search" placeholder="Qidiruv" />
          <select class="select" id="statusFilter"></select>
          <button class="btn secondary" type="button" id="refreshBtn">Yangilash</button>
        </div>
      </section>

      <section class="stats" style="margin-top: 14px;">
        <div class="metric">Mijozlar<b id="sClients">0</b></div>
        <div class="metric">Tushum<b id="sPaid">0</b></div>
        <div class="metric warning">Qoldiq<b id="sDebt">0</b></div>
        <div class="metric">Tayyor<b id="sReady">0</b></div>
        <div class="metric">Yetkazildi<b id="sDelivered">0</b></div>
      </section>

      <section class="panel" style="margin-top: 14px;">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Chek</th>
                <th>Mijoz</th>
                <th>Telefon</th>
                <th>Sana</th>
                <th>Jami</th>
                <th>To‘langan</th>
                <th>Qoldiq</th>
                <th>Holat</th>
                <th>Amal</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <ul class="mobile-list" id="mobileList"></ul>
      </section>
    </main>
  </div>

  <script src="shared.js"></script>
  <script>
    const {
      apiFetch,
      createStatusBadge,
      downloadBackup,
      exportCsv,
      formatDate,
      formatMoney,
      loadMeta,
      logout,
      readJsonResponse,
      statusLabel,
    } = window.GilamApp;

    const tbody = document.getElementById("tbody");
    const mobileList = document.getElementById("mobileList");
    const searchInput = document.getElementById("search");
    const statusFilter = document.getElementById("statusFilter");
    const btnToday = document.getElementById("btnToday");
    const btnAll = document.getElementById("btnAll");
    const btnDebt = document.getElementById("btnDebt");
    const refreshBtn = document.getElementById("refreshBtn");
    const exportBtn = document.getElementById("exportBtn");
    const backupBtn = document.getElementById("backupBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const sClients = document.getElementById("sClients");
    const sPaid = document.getElementById("sPaid");
    const sDebt = document.getElementById("sDebt");
    const sReady = document.getElementById("sReady");
    const sDelivered = document.getElementById("sDelivered");

    let orders = [];
    let statuses = [];
    let mode = "today";

    function isToday(value) {
      return new Date(value).toDateString() === new Date().toDateString();
    }

    function visibleOrders() {
      const search = searchInput.value.trim().toLowerCase();
      const status = statusFilter.value;

      return orders.filter((order) => {
        const searchable = [
          order.orderNoLabel,
          order.name,
          order.phone,
          order.address,
        ].join(" ").toLowerCase();
        const matchesMode =
          mode === "all" ||
          (mode === "today" && isToday(order.createdAt)) ||
          (mode === "debt" && Number(order.balance || 0) > 0);

        return (
          matchesMode &&
          (!search || searchable.includes(search)) &&
          (!status || order.status === status)
        );
      });
    }

    function addCell(row, text, className = "") {
      const td = document.createElement("td");
      td.textContent = text;
      if (className) td.className = className;
      row.appendChild(td);
      return td;
    }

    function createStatusSelect(order) {
      const select = document.createElement("select");
      select.className = "select";
      statuses.forEach((status) => {
        const option = document.createElement("option");
        option.value = status.value;
        option.textContent = status.label;
        select.appendChild(option);
      });
      select.value = order.status || "received";
      select.addEventListener("change", () => updateStatus(order._id, select.value));
      return select;
    }

    function setMode(nextMode) {
      mode = nextMode;
      btnToday.className = mode === "today" ? "btn" : "btn secondary";
      btnAll.className = mode === "all" ? "btn" : "btn secondary";
      btnDebt.className = mode === "debt" ? "btn" : "btn secondary";
      render();
    }

    function renderStats(list) {
      sClients.textContent = list.length;
      sPaid.textContent = `${formatMoney(list.reduce((sum, order) => sum + Number(order.paid || 0), 0))} so‘m`;
      sDebt.textContent = `${formatMoney(list.reduce((sum, order) => sum + Number(order.balance || 0), 0))} so‘m`;
      sReady.textContent = list.filter((order) => order.status === "ready").length;
      sDelivered.textContent = list.filter((order) => order.status === "delivered").length;
    }

    function showMessage(message) {
      tbody.replaceChildren();
      mobileList.replaceChildren();
      const tr = document.createElement("tr");
      const td = addCell(tr, message);
      const li = document.createElement("li");
      td.colSpan = 9;
      li.className = "mobile-card";
      li.textContent = message;
      tbody.appendChild(tr);
      mobileList.appendChild(li);
    }

    function createActions(order) {
      const wrap = document.createElement("div");
      const printButton = document.createElement("button");
      const payButton = document.createElement("button");

      wrap.className = "actions";
      printButton.className = "btn small";
      printButton.type = "button";
      printButton.textContent = "Chop etish";
      printButton.addEventListener("click", () => window.open(`print.html?id=${encodeURIComponent(order._id)}`, "_blank"));

      payButton.className = "btn secondary small";
      payButton.type = "button";
      payButton.textContent = "To‘lov";
      payButton.addEventListener("click", () => updatePayment(order));

      wrap.append(printButton, payButton);
      return wrap;
    }

    function render() {
      const list = visibleOrders();
      tbody.replaceChildren();
      mobileList.replaceChildren();
      renderStats(list);

      if (!list.length) {
        showMessage("Ma’lumot yo‘q");
        return;
      }

      list
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
        .forEach((order) => {
          const tr = document.createElement("tr");
          addCell(tr, order.orderNoLabel || "№----");
          addCell(tr, order.name || "—");
          addCell(tr, order.phone || "—");
          addCell(tr, formatDate(order.createdAt));
          addCell(tr, `${formatMoney(order.total)} so‘m`);
          addCell(tr, `${formatMoney(order.paid)} so‘m`);
          addCell(tr, `${formatMoney(order.balance)} so‘m`, Number(order.balance || 0) > 0 ? "debt" : "");

          const statusCell = document.createElement("td");
          statusCell.append(createStatusBadge(order.status, statuses), document.createTextNode(" "), createStatusSelect(order));
          tr.appendChild(statusCell);

          const actionCell = document.createElement("td");
          actionCell.appendChild(createActions(order));
          tr.appendChild(actionCell);
          tbody.appendChild(tr);

          const card = document.createElement("li");
          const title = document.createElement("div");
          const meta = document.createElement("div");
          const metrics = document.createElement("div");
          const statusLine = document.createElement("div");

          card.className = "mobile-card";
          title.className = "card-title";
          title.textContent = `${order.orderNoLabel || "№----"} · ${order.name || "—"}`;
          meta.className = "meta";
          meta.textContent = `${order.phone || ""} · ${formatDate(order.createdAt)}`;
          metrics.className = "summary-grid";
          [
            ["Jami", order.total, false],
            ["To‘langan", order.paid, false],
            ["Qoldiq", order.balance, Number(order.balance || 0) > 0],
          ].forEach(([label, value, warning]) => {
            const metric = document.createElement("div");
            const text = document.createElement("span");
            const bold = document.createElement("b");
            metric.className = warning ? "metric warning" : "metric";
            text.textContent = label;
            bold.textContent = `${formatMoney(value)} so‘m`;
            metric.append(text, bold);
            metrics.appendChild(metric);
          });
          statusLine.className = "toolbar";
          statusLine.append(createStatusBadge(order.status, statuses), createStatusSelect(order));
          card.append(title, meta, metrics, statusLine, createActions(order));
          mobileList.appendChild(card);
        });
    }

    function fillStatuses() {
      statusFilter.replaceChildren();
      const all = document.createElement("option");
      all.value = "";
      all.textContent = "Barcha holatlar";
      statusFilter.appendChild(all);
      statuses.forEach((status) => {
        const option = document.createElement("option");
        option.value = status.value;
        option.textContent = status.label;
        statusFilter.appendChild(option);
      });
    }

    async function loadOrders() {
      const response = await apiFetch("/orders?limit=1000");
      orders = await readJsonResponse(response);
      render();
    }

    async function updateStatus(id, status) {
      try {
        const response = await apiFetch(`/orders/${encodeURIComponent(id)}/status`, {
          method: "PUT",
          body: JSON.stringify({ status }),
        });
        await readJsonResponse(response);
        await loadOrders();
      } catch (error) {
        alert(error.message || "Holatni yangilashda xatolik");
      }
    }

    async function updatePayment(order) {
      const value = prompt("To‘langan summa", order.paid || 0);
      if (value === null) return;

      try {
        const response = await apiFetch(`/orders/${encodeURIComponent(order._id)}/payment`, {
          method: "PATCH",
          body: JSON.stringify({
            paid: Number(value),
            paymentType: order.paymentType || "Naqd",
          }),
        });
        await readJsonResponse(response);
        await loadOrders();
      } catch (error) {
        alert(error.message || "To‘lovni yangilashda xatolik");
      }
    }

    function exportVisible() {
      exportCsv(
        "hisobot.csv",
        ["Chek", "Ism", "Telefon", "Sana", "Holat", "Jami", "To'langan", "Qoldiq"],
        visibleOrders().map((order) => [
          order.orderNoLabel,
          order.name,
          order.phone,
          formatDate(order.createdAt),
          statusLabel(order.status, statuses),
          order.total,
          order.paid,
          order.balance,
        ])
      );
    }

    async function init() {
      try {
        const meta = await loadMeta();
        statuses = meta.statuses;
        fillStatuses();
        await loadOrders();
      } catch (error) {
        showMessage(error.message || "Hisobotlarni yuklashda xatolik");
      }
    }

    searchInput.addEventListener("input", render);
    statusFilter.addEventListener("change", render);
    btnToday.addEventListener("click", () => setMode("today"));
    btnAll.addEventListener("click", () => setMode("all"));
    btnDebt.addEventListener("click", () => setMode("debt"));
    refreshBtn.addEventListener("click", () => loadOrders().catch((error) => alert(error.message)));
    exportBtn.addEventListener("click", exportVisible);
    backupBtn.addEventListener("click", () => downloadBackup().catch((error) => alert(error.message)));
    logoutBtn.addEventListener("click", logout);

    init();
  </script>
</body>

</html>
